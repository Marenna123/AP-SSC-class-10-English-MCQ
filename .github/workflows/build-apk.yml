name: Build Android APK (build-apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android Platform
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Generating fresh Android platform files..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AP-SSC-English-MCQ.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AP-SSC-English-MCQ-Android-APK
          path: AP-SSC-English-MCQ.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "AP SSC English MCQ - Latest Android APK"
          body: |
            ### 📱 Download Android APK
            Official AP SSC Class 10 English MCQ Practice App for Android.

            - **Direct Download:** Click `AP-SSC-English-MCQ.apk` below to download directly to your Android device.
            - **Installation:** Open the downloaded `.apk` file on your phone and tap **Install**.
          draft: false
          prerelease: false
          files: AP-SSC-English-MCQ.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
