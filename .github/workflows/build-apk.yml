name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor and Android Platform
        run: |
          npm install --save @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.apssc.englishmcq","appName":"AP SSC English","webDir":"dist"}' > capacitor.config.json
          fi
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AP-SSC-English-MCQ-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
